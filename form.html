<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    nav {
        background-color: black ;
        color: white;
        box-sizing: border-box;
        height: 40px;
    }
    a {
        margin-right: 100px;
    }
    #logo {
        font-size: 30pxpx;
    }
    .login {
        margin: 20px;
        border: 3px;
        border-style: solid;
        text-align: center;
        padding-bottom: 30px;
        background-color: black;
        color: white;
        border-radius: 10px;
        border-color:black;
        width: 500px;
        text-align: center;
        margin: 50px auto;
        
    }
    .section {
        border: 3px;
        text-align: center;
        font-family:Verdana, Geneva, Tahoma, sans-serif;
    }
    button {
        background-color: #ff9800;
        height: 40px;
        width: 300px;
        margin-bottom: 15px;
        padding: 5px;
        text-align: center;
        font-size: 20px;
        display: block;
        margin: 10px auto;
        border: 3px;
        border-style: solid;
        border-radius: 5px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        box-sizing: border-box;
    }
    input {
        margin-bottom: 20px;
        display: block;
        margin-left: 50px;
        height: 30px;
        width: 300px;
        margin: 10px auto;
        border: 3px;
        border-style: solid;
        border-radius: 5px;
        padding: 5px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        /* box-sizing: border-box; */

        
    }
    </style>
<body>
    <span>
    <nav>
        <a id="logo">LUXURY WEAR</a>
        <a>Home</a>
        <a>Login</a>
        <a>About</a>
        <a>Contact</a>
        
    </nav>
    </span>

    <form class="section">
        <div class="login">
            <h1>Signup / Login</h1>
            <input type="text" placeholder="Username">
            <input type="text" placeholder="Email">
            <input type="text" placeholder="Password">
            <button>Signup</button>
            <button>Login</button>

        </div>

    </form>
</body>
</html>
