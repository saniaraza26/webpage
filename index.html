<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Level 1</title>

    <!-- Using External Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Using Style tag -->
     <style>
        h2{
            color: blueviolet;
        }
     </style>

     <style>
        div{
            background-color:blue;
        }
     </style>

</head>
<body>

    <!-- Inline styling -->
   <h1 style="color: aquamarine;">Hello World</h1>

   <!-- Using Style tag -->
   <h2>Hello World</h2>

   <!-- Using External Stylesheet -->
   <h3>Hello!I'm Sania</h3>

   <p>This is a paragraph</p>

   <!-- Creating Button -->
   <button>Click me</button>

    <!-- Making Idz -->
   <h4 id="a01">Hyper Text Markup Language</h4>
   <h4 id="a02">Hyper Text Markup Language</h4>
   <h4 id="b03">Hyper Text Markup Language</h4>

    <!-- Making Classes -->
   <h5 class="a5">Cascading Style Sheet</h5>
   <h5 class="a5">Heading</h5>
   <h5 class="a5">heading 4</h5>

</body>
</html>
